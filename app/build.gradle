plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.salonapp'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.salonapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Chỉ giữ lại ABI phổ biến của điện thoại thực tế để loại bỏ các thư viện MediaPipe/CameraX thừa
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:latest.release'
    def cameraxVersion = '1.4.2'
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
}

// MediaPipe task bundles are hosted separately from the Maven runtime. Download the official
// Face Landmarker bundle at build time so it is packaged as an app asset.
def faceLandmarkerFile = file('src/main/assets/face_landmarker.task')
tasks.register('downloadFaceLandmarkerModel') {
    outputs.file(faceLandmarkerFile)
    doLast {
        if (!faceLandmarkerFile.exists()) {
            faceLandmarkerFile.parentFile.mkdirs()
            def connection = new URL('https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task').openConnection()
            connection.setConnectTimeout(15000)
            connection.setReadTimeout(60000)
            try {
                connection.getInputStream().withCloseable { input ->
                    faceLandmarkerFile.withOutputStream { output -> output << input }
                }
            } catch (Exception error) {
                faceLandmarkerFile.delete()
                throw new GradleException('Could not download the MediaPipe Face Landmarker model. Check internet access and rebuild.', error)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('downloadFaceLandmarkerModel') }